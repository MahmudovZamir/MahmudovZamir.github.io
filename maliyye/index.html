<title>Maliyyə Kitabı</title>
<style>/* Layout idea: ledger-like cool paper surface, deep green ink for money in, vermilion for money out; bottom tab bar on phones, side rail on desktop. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#10211F; --muted:#5E716E; --line:#DCE4E2;
  --brand:#0B6B5D; --brand-ink:#FFFFFF; --brand-soft:#DDF1EC;
  --inc:#12805A; --exp:#D2432A; --warn:#B7791F; --info:#2F5DA8;
  --shadow:0 1px 2px rgba(16,33,31,.06),0 6px 18px rgba(16,33,31,.06);
  --r:16px; --font:'Manrope','Noto Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1514; --surface:#16211F; --surface-2:#1B2826; --ink:#E7F0EE; --muted:#93A8A4; --line:#27373A;
    --brand:#2BB59E; --brand-ink:#04211C; --brand-soft:#16352F; --inc:#3CCB93; --exp:#FF7A5F; --warn:#E3B04B; --info:#7FA7E8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#16211F; --surface-2:#1B2826; --ink:#E7F0EE; --muted:#93A8A4; --line:#27373A;
  --brand:#2BB59E; --brand-ink:#04211C; --brand-soft:#16352F; --inc:#3CCB93; --exp:#FF7A5F; --warn:#E3B04B; --info:#7FA7E8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--brand)}
.ic{flex:none;display:block}
.hide{display:none!important}
.muted{color:var(--muted)}
.inc{color:var(--inc)} .exp{color:var(--exp)} .warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* shell */
#root{min-height:100%;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;padding:0 16px 110px;max-width:1120px;margin:0 auto;width:100%}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);position:relative;color:var(--ink)}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--exp);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--inc);display:block}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite}
.sync.err i{background:var(--exp)}
@keyframes pulse{50%{opacity:.3}}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:2px}
.monthnav button{width:34px;height:36px;display:grid;place-items:center;border-radius:10px}
.monthnav b{font-size:14px;min-width:104px;text-align:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,33,31,.06)}
.tabbar .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:12px}
.tabbar .tb.on{color:var(--brand)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 40%,transparent)}
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;gap:6px;width:236px;flex:none;padding:22px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 18px}
  .rail .brand span.lg{width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
  .rail .tb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
  .rail .tb:hover{background:var(--surface-2)}
  .rail .tb.on{background:var(--brand-soft);color:var(--brand)}
  .rail .addbtn{margin-top:10px;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:12px;display:flex;gap:8px;align-items:center;justify-content:center;font-weight:700}
  .tabbar{display:none}
  .main{padding:0 28px 40px}
}

/* cards & grid */
.grid{display:grid;gap:14px}
@media (min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.span2{grid-column:span 2}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.card h2 button.link{font-size:13px;font-weight:700;color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 10px;min-width:0}
.tile small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.tile b{display:block;font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis}
.tile em{font-style:normal;font-size:11px;color:var(--muted)}
.tile.hero{background:var(--brand);color:var(--brand-ink)} .tile.hero small,.tile.hero em{color:color-mix(in srgb,var(--brand-ink) 78%,transparent)}
@media (max-width:420px){.tile b{font-size:16px}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.badge.red{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.badge.amber{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.green{background:color-mix(in srgb,var(--inc) 14%,transparent);color:var(--inc)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-radius:12px;text-align:left;width:100%}
button.row:hover{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:800;font-size:14.5px;text-align:right}
.row .amt small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.cico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,#888) 15%,var(--surface));color:var(--c,#888)}
.cico.sm{width:30px;height:30px;border-radius:10px}
.cico.lg{width:52px;height:52px;border-radius:16px}
.dayh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 4px 4px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .ic{margin:0 auto 8px;opacity:.6}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* bars / progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--brand))}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lg-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px;width:100%;text-align:left}
.lg-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lg-row .pc{color:var(--muted);font-size:12px;margin-left:6px;font-weight:600}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
svg text{font-family:var(--font)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.k-e button.on{color:var(--exp)} .seg.k-i button.on{color:var(--inc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.accs{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.acc{flex:none;width:168px;border-radius:16px;padding:12px;color:#fff;background:linear-gradient(135deg,var(--c1,#0B6B5D),var(--c2,#14907D));text-align:left;position:relative;overflow:hidden}
.acc small{opacity:.85;font-size:12px;display:flex;align-items:center;gap:6px}
.acc b{display:block;font-size:18px;margin-top:10px;font-weight:800;letter-spacing:-.02em}
.acc:after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.12)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));box-shadow:var(--shadow)}
.alert.red{background:color-mix(in srgb,var(--exp) 12%,var(--surface))}
.alert .mid{flex:1;min-width:0}
.alert .mid b{display:block;font-size:14px}
.alert .mid small{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:14px}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--brand);padding:8px 10px}
.btn.danger{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;padding:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* forms & sheets */
#sheetbg{position:fixed;inset:0;background:rgba(8,16,15,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
#sheetbg.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;overflow:hidden}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@media (min-width:640px){#sheetbg{align-items:center}.sheet{border-radius:22px;max-height:90%}}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet header h3{flex:1;font-size:17px;font-weight:800}
.sheet .body{padding:4px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet footer .btn{flex:1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.in,select.in,textarea.in{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;outline:none;min-width:0}
.in:focus{border-color:var(--brand);background:var(--surface)}
.in.err{border-color:var(--exp)}
.amountbox{display:flex;align-items:baseline;gap:8px;justify-content:center;padding:6px 0}
.amountbox input{font-size:40px;font-weight:800;text-align:center;border:0;background:transparent;width:100%;outline:none;letter-spacing:-.02em}
.amountbox span{font-size:24px;font-weight:800;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:520px){.catgrid{grid-template-columns:repeat(5,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:14px;font-size:11.5px;font-weight:700;text-align:center;border:1.5px solid transparent;line-height:1.15}
.cat span.t{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat.on{border-color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,#888) 10%,var(--surface))}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--c)}
.iconpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:180px;overflow-y:auto;padding:2px}
.ip{height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.ip.on{background:var(--c,var(--brand));color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch b{font-weight:700;font-size:14.5px;display:block} .switch small{color:var(--muted);font-size:12.5px;display:block}
.tg{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--brand)} .tg.on:after{transform:translateX(18px)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;align-items:center;gap:12px;max-width:92vw;font-weight:600;font-size:14px}
#toast.on{display:flex}
#toast button{color:var(--brand-soft);font-weight:800}
@media (min-width:900px){#toast{bottom:28px}}

/* lock & splash */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#lock.on{display:flex}
.lockcard{width:100%;max-width:360px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.lockcard .logo{width:64px;height:64px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto}
.lockcard h2{font-size:21px;font-weight:800}
.lockcard p{margin:0;color:var(--muted);font-size:13.5px}
.lockcard .err{color:var(--exp);font-weight:700;font-size:13px;min-height:18px}
.pwin{text-align:center;font-size:20px;letter-spacing:.2em}
.pwin::placeholder{letter-spacing:0;font-size:15px}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90}
.splash div{text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sec-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.kv + .kv{border-top:1px solid var(--line)}
.kv b{font-weight:700}
.flowlbl{font-size:10.5px;fill:var(--ink);font-weight:700}
.flowsub{font-size:9.5px;fill:var(--muted)}
.axis{font-size:10px;fill:var(--muted)}
.tiny{font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){.hide-sm{display:none}}
@media (max-width:480px){.top{gap:6px}.top h1{font-size:17px}.monthnav button{width:28px}.monthnav b{min-width:0;font-size:13px;padding:0 2px;white-space:nowrap}.iconbtn{width:38px;height:38px}}

/* ===== iOS layer ===== */
:root{--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Manrope','Segoe UI',system-ui,sans-serif;--bg:#F2F2F7;--surface-2:#F2F4F5;--line:#E5E5EA;--r:18px;
  --shadow:0 0.5px 0 rgba(0,0,0,.04),0 4px 14px rgba(20,30,40,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#1C1C1E;--surface-2:#2C2C2E;--line:#38383A;--shadow:none}}
:root[data-theme="dark"]{--bg:#000;--surface:#1C1C1E;--surface-2:#2C2C2E;--line:#38383A;--shadow:none}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.main{padding:0 16px calc(118px + env(safe-area-inset-bottom))}
.top{padding:calc(8px + env(safe-area-inset-top)) 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.top .sp{flex:1}
.top .smt{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.top.scrolled{border-bottom-color:var(--line)} .top.scrolled .smt{opacity:1}
.top .iconbtn{background:transparent;box-shadow:none;color:var(--brand);width:38px;height:38px}
.navback{display:flex;align-items:center;gap:0;color:var(--brand);font-size:16px;font-weight:500;margin-left:-8px}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 0 14px;flex-wrap:wrap}
.lt h1{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.lt .monthnav{box-shadow:none;background:var(--surface)}
@media (max-width:480px){.lt h1{font-size:30px}.monthnav b{min-width:96px}}
.tabbar{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line);padding:6px 4px calc(4px + env(safe-area-inset-bottom))}
.tabbar .tb{font-size:10.5px;font-weight:600;gap:3px}
.fab{width:56px;height:56px;border-radius:50%;margin-top:-22px;background:linear-gradient(145deg,#14907D,#0B6B5D);color:#fff;box-shadow:0 8px 22px rgba(11,107,93,.42),0 0 0 5px var(--bg)}
.fab:active,.qa:active,.mrow:active,.mt:active,.addbig button:active{transform:scale(.96)}
button{transition:transform .12s}
.card{border-radius:var(--r)}
.card h2{font-size:17px;letter-spacing:-.015em}
/* hero */
.hero{border-radius:24px;padding:18px 18px 14px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#1FA58C 0%,transparent 55%),linear-gradient(150deg,#0E7A69 0%,#0A5A4F 55%,#06382F 100%);box-shadow:0 14px 34px rgba(8,80,68,.30);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero small{font-size:12.5px;opacity:.8;display:flex;align-items:center;gap:5px;font-weight:600}
.hero .big{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;margin:2px 0}
.hero-sub{font-size:12px;opacity:.7}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;color:#fff;position:relative}
.hero-spark{margin:6px -18px 4px;opacity:.95}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(255,255,255,.10);border-radius:16px;padding:10px 12px;position:relative}
.hero-row b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.hero-row em{font-style:normal;font-size:11px;font-weight:700;opacity:.85}
.hero-row em.gd{color:#9EF3D6;opacity:1} .hero-row em.bd{color:#FFB4A3;opacity:1}
/* quick actions */
.qas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink)}
.qa span{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--surface);color:var(--c);box-shadow:var(--shadow)}
/* insights */
.ins{display:flex;flex-direction:column;gap:10px}
.in-row{display:flex;gap:10px;align-items:center;font-size:13.5px;line-height:1.35}
.in-row b{font-weight:800}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.minis div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.minis small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.minis b{font-size:14.5px;font-weight:800}
.lgnd{display:flex;gap:14px;margin-top:6px}.lgnd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.budg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bg-i{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--surface-2);color:var(--ink)}
.bg-i b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg-i small{font-size:11.5px;color:var(--muted)}
.acc{width:172px;min-height:104px;border-radius:18px;box-shadow:0 8px 18px color-mix(in srgb,var(--c1) 30%,transparent)}
.acc .chipnum{position:absolute;right:12px;bottom:10px;font-size:10.5px;font-weight:800;opacity:.75;letter-spacing:.06em}
.acc.add{width:96px;background:var(--surface-2);color:var(--muted);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line)}
.acc.add:after{display:none}
.lg2{grid-template-columns:auto 1fr auto}
.lg2 .nm{display:block}
.lbar{display:block;height:5px;border-radius:9px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.lbar i{display:block;height:100%;border-radius:9px}
/* calendar heatmap */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hc-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.hc{aspect-ratio:1;border-radius:10px;background:color-mix(in srgb,var(--exp) calc(var(--k)*85%),var(--surface-2));display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);min-width:0}
.hc b{font-size:12.5px;font-weight:700} .hc small{font-size:9px;font-weight:700;opacity:.85}
.hc[style*="--k:0."]:not([style*="--k:0.00"]) {color:var(--ink)}
.hc.today{box-shadow:0 0 0 2px var(--brand)} .hc.fut{opacity:.4}
.heat-l{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:8px;font-size:11px;color:var(--muted)}
.heat-l i{width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--exp) calc(var(--k)*85%),var(--surface-2))}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:170px;align-items:end}
.wk div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wk i{width:70%;max-width:34px;border-radius:9px;background:color-mix(in srgb,var(--exp) 45%,var(--surface-2));display:block}
.wk small{font-size:11px;color:var(--muted);font-weight:700} .wk b{font-size:11px;font-weight:800}
/* menu */
.mhead{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.mlogo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#14907D,#0B6B5D)}
.mhead .mid{flex:1;min-width:0}.mhead small{display:block;color:var(--muted);font-size:12.5px}.mhead b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);color:var(--c)}
.mt b{color:var(--ink);font-size:17px;font-weight:800;margin-top:6px;letter-spacing:-.02em}.mt small{color:var(--muted);font-size:12px;font-weight:600}
@media (min-width:700px){.mtiles{grid-template-columns:repeat(4,1fr)}}
.mgroup{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.mg-t{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px 4px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 16px;text-align:left;color:var(--ink);position:relative}
.mrow + .mrow:before{content:"";position:absolute;left:60px;right:0;top:0;border-top:.5px solid var(--line)}
.mi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.mrow .mid{flex:1;min-width:0}.mrow .mid b{display:block;font-size:15.5px;font-weight:600}.mrow .mid small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr{color:var(--muted);font-size:14px}.chev{color:var(--muted);opacity:.6}
.istep{display:flex;gap:12px;align-items:center;padding:10px 0}.istep + .istep{border-top:.5px solid var(--line)}
.istep div{flex:1}.istep b{display:block;font-size:15px}.istep small{color:var(--muted);font-size:13px}
.inum{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.iic{color:var(--brand)}
/* add sheet */
.addbig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.addbig button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:18px;background:color-mix(in srgb,var(--c) 11%,var(--surface));color:var(--c)}
.addbig span{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.addbig b{font-size:15px;color:var(--ink)}
.addsm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addsm button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2);font-weight:700;font-size:13.5px;text-align:left}
.tpl{display:flex;flex-direction:column}
.tpl button{display:flex;align-items:center;gap:10px;padding:9px 4px;text-align:left}
.tpl button + button{border-top:.5px solid var(--line)}
.tpl .mid{flex:1;min-width:0}.tpl .mid b{display:block;font-size:14px}.tpl .mid small{font-size:12px;color:var(--muted)}
/* sheet iOS */
.sheet{border-radius:14px 14px 0 0;position:relative;padding-top:6px}
.sheet:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:var(--line)}
.sheet footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.btn{border-radius:14px}
.seg{border-radius:10px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.seg button{border-radius:8px}
.chip{box-shadow:none;background:var(--surface)}
@media (min-width:900px){.qas{grid-template-columns:repeat(5,110px)}.top{margin:0;padding-left:0;padding-right:0;background:var(--bg)}}
.sheet .body > *{flex-shrink:0}
</style></head>

<script>/* ===== local storage adapter (standalone build): data lives on this device ===== */
(() => {
  const KEY = 'mk-data-v1', subs = [];
  let store = {}, ready;
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
  /* IndexedDB mirror: second copy, used if localStorage is ever cleared */
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('maliyye', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbPut = v => idb().then(db => new Promise(r => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, KEY); t.oncomplete = r; t.onerror = r; })).catch(() => { });
  const idbGet = () => idb().then(db => new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(KEY); q.onsuccess = () => r(q.result); q.onerror = () => r(null); })).catch(() => null);
  ready = (async () => {
    if (!Object.keys(store).length) { const b = await idbGet(); if (b) { try { store = JSON.parse(b) || {}; localStorage.setItem(KEY, b); } catch (e) { } } }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
  })();
  let t;
  const persist = () => {
    const s = JSON.stringify(store);
    localStorage.setItem(KEY, s); /* synchronous: saved the moment you tap Saxla */
    idbPut(s);
  };
  const emit = () => subs.forEach(s => {
    const pre = s.path + '/';
    const docs = Object.keys(store).filter(p => p.startsWith(pre) && !p.slice(pre.length).includes('/')).map(p => ({ id: p.slice(pre.length), data: () => JSON.parse(JSON.stringify(store[p])) }));
    s.cb({ docs, metadata: { fromCache: false } });
  });
  const db = {
    doc: p => ({
      set: async v => { store[p] = JSON.parse(JSON.stringify(v)); persist(); setTimeout(emit, 0); },
      update: async v => { store[p] = Object.assign(store[p] || {}, v); persist(); setTimeout(emit, 0); },
      delete: async () => { delete store[p]; persist(); setTimeout(emit, 0); },
      get: async () => ({ exists: !!store[p], data: () => store[p] })
    }),
    collection: p => ({ onSnapshot: cb => { subs.push({ path: p, cb }); ready.then(() => setTimeout(emit, 0)); return () => { }; } })
  };
  window.addEventListener('storage', e => { if (e.key === KEY) { try { store = JSON.parse(e.newValue || '{}'); emit(); } catch (x) { } } });
  window.claude = { use: async n => n === 'db' ? db : n === 'user' ? { id: async () => 'me' } : null };
  window.LOCAL_BUILD = true;
})();

const qs = {};
function setSync() {

  el.querySelector('span').textContent = S.saveErr ? 'Saxlanmadı' : S.pending ? 'Saxlanılır…' : 'Saxlanıldı';
}
function enqueue(docId, fn) {
  S.pending++; setSync();
  const prev = qs[docId] || Promise.resolve();
  const run = prev.catch(() => { }).then(fn).then(() => { S.dirty.delete(docId); }).catch(e => { S.dirty.add(docId); S.saveErr = true; console.warn('save failed', docId, e); })
    .finally(() => { S.pending--; if (!S.pending && !S.dirty.size) S.saveErr = false; setSync(); });
  qs[docId] = run; return run;
}
async function writeDoc(docId) {
  /* always write the full merged document (set): safe, simple; snapshot subscription keeps local copy current */
  await S.db.doc(`data/users/${S.uid}/${docId}`).set(clone(S.docs[docId] || {})); S.remote.add(docId);
}
/* patch is merged locally at once, then written (update merges per item, so devices do not overwrite each other) */
function save(docId, patch) {
  S.docs[docId] = deepMerge(S.docs[docId] ? S.docs[docId] : {}, clone(patch));
  rebuild();
  return enqueue(docId, () => writeDoc(docId, patch));
}
function putItem(docId, item) { return save(docId, { items: { [item.id]: item } }); }
function hardDelete(docId, id) {
  if (S.docs[docId] && S.docs[docId].items) delete S.docs[docId].items[id];
  rebuild();
  return enqueue(docId, () => { return S.db.doc(`data/users/${S.uid}/${docId}`).set(S.docs[docId] || { items: {} }); });
}

function putTx(t) {

  const old = D.txMap[t.id];
  if (old && txDocId(old.d) !== txDocId(t.d)) hardDelete(txDocId(old.d), t.id);

}
function softDelTx(t) { const c = { ...t, x: 1, ts: Date.now() }; return putItem(txDocId(c.d), c); }
function setCfg(patch) { return save('settings', patch); }

  S.saveErr = false;

}

function txAmtBase(t) { return toBase(t.a, accOf(t.ac).cur); }

function balances() {
  const b = {};
  for (const id in D.accounts) b[id] = D.accounts[id].ob || 0;
  for (const t of D.tx) {
    if (t.k === 'e') { if (b[t.ac] != null) b[t.ac] -= t.a; }
    else if (t.k === 'i') { if (b[t.ac] != null) b[t.ac] += t.a; }
    else if (t.k === 't') { if (b[t.ac] != null) b[t.ac] -= t.a; if (t.ac2 && b[t.ac2] != null) b[t.ac2] += (t.a2 != null ? t.a2 : t.a); }
  }
  return b;
}
function periodOf(ym) {
  const ms = D.cfg.ms || 1, [y, m] = ym.split('-').map(Number);

}
function ymOfDate(s) {

  for (const t of list) {
    if (t.k === 't') continue;
    const v = txAmtBase(t);
    if (t.k === 'i') { r.inc += v; const c = catRoot(t.ca); const key = c ? c.id : 'none'; r.byInc[key] = (r.byInc[key] || 0) + v; }
    else {

      const rc = catRoot(t.ca); const key = rc ? rc.id : 'none'; r.byRoot[key] = (r.byRoot[key] || 0) + v;

  for (const l of Object.values(D.loans)) if (!l.cl && l.nd) {
    const days = diffDays(l.nd, t); if (days <= (W ? rdDef : (l.rd != null ? l.rd : rdDef))) out.push({ type: 'loan', id: l.id, title: l.n, sub: 'Kredit ödənişi', date: l.nd, amt: l.pay, days, ic: 'bank', co: '#8A3B3B' });
  }
  for (const d of Object.values(D.debts)) if (!d.cl && d.due) {
    const days = diffDays(d.due, t); if (days <= (W ? rdDef : (d.rd != null ? d.rd : rdDef))) out.push({ type: 'debt', id: d.id, title: d.who, sub: d.dir === 'owe' ? 'Borcun qaytarılması' : 'Sizə qaytarılmalıdır', date: d.due, amt: d.a - (d.paid || 0), days, ic: 'users', co: d.dir === 'owe' ? '#D2432A' : '#12805A' });
  }

    const days = diffDays(r.nd, t); if (days <= (W ? rdDef : (r.rd != null ? r.rd : rdDef))) out.push({ type: 'rec', id: r.id, title: r.n, sub: 'Təkrarlanan ödəniş', date: r.nd, amt: r.a, days, ic: catOf(r.ca) ? catOf(r.ca).ic : 'repeat', co: catOf(r.ca) ? catOf(r.ca).co : '#2F5DA8' });

}

function nextByFreq(date, fr, day) { return fr === 'd' ? addDays(date, 1) : fr === 'w' ? addDays(date, 7) : fr === 'y' ? addMonths(date, 12, day) : addMonths(date, 1, day); }

/* ===== charts (hand-drawn SVG) ===== */
function arcPath(cx, cy, r, a0, a1) {
  const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function donutSvg(items, top, bottom) {
  const cx = 90, cy = 90, r = 70, th = 24, tot = sum(items, i => i.v);
  let segs = '';
  if (!tot) segs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${th}"/>`;
  else if (items.length === 1) segs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${items[0].color}" stroke-width="${th}"><title>${esc(items[0].label)}: ${fmtNum(items[0].v)}</title></circle>`;
  else {
    let a = -Math.PI / 2;
    for (const it of items) {
      const ang = it.v / tot * Math.PI * 2, gap = Math.min(0.035, ang / 3);
      segs += `<path d="${arcPath(cx, cy, r, a + gap / 2, a + ang - gap / 2)}" fill="none" stroke="${it.color}" stroke-width="${th}"><title>${esc(it.label)}: ${fmtNum(it.v)} (${pct(it.v, tot)}%)</title></path>`;
      a += ang;
    }
  }
  return `<svg class="chart" viewBox="0 0 180 180" style="width:172px;flex:none" role="img" aria-label="Bölgü diaqramı">${segs}
    <text x="90" y="86" text-anchor="middle" style="font-size:11px;fill:var(--muted);font-weight:600">${esc(top)}</text>
    <text x="90" y="106" text-anchor="middle" style="font-size:17px;font-weight:800;fill:var(--ink)">${esc(bottom)}</text></svg>`;
}
function niceMax(v) {
  if (v <= 0) return 100;
  const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function barsSvg(days, avg, today) {
  const W = 640, H = 170, L = 38, B = 22, T = 8, n = days.length || 1;
  const max = niceMax(Math.max(1, ...days.map(d => d.v), avg || 0));
  const bw = (W - L) / n, y = v => T + (H - B - T) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 2; i++) {
    const v = max * i / 2, yy = y(v);
    g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text class="axis" x="${L - 6}" y="${yy + 3}" text-anchor="end">${compact(v)}</text>`;
  }
  days.forEach((d, i) => {
    const x = L + i * bw + bw * 0.16, w = Math.max(2, bw * 0.68), h = Math.max(d.v ? 2 : 0, (H - B - T) * d.v / max);
    const col = d.date > today ? 'var(--line)' : d.date === today ? 'var(--brand)' : 'color-mix(in srgb,var(--exp) 78%,var(--surface))';
    g += `<rect x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, w / 2)}" fill="${col}"><title>${dShort(d.date)}: ${fmtNum(d.v)}</title></rect>`;
    if (n <= 16 || i % 5 === 0 || i === n - 1) g += `<text class="axis" x="${(x + w / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${parseD(d.date).getDate()}</text>`;
  });
  if (avg) g += `<line x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="axis" x="${W}" y="${y(avg) - 4}" text-anchor="end" style="fill:var(--warn);font-weight:700">orta ${compact(avg)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gündəlik xərc">${g}</svg>`;
}
function linesSvg(months) {
  const W = 640, H = 190, L = 40, B = 24, T = 10, n = months.length;
  const max = niceMax(Math.max(1, ...months.map(m => Math.max(m.inc, m.exp))));
  const x = i => L + (W - L - 10) * (n === 1 ? 0.5 : i / (n - 1)), y = v => T + (H - B - T) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max * i / 3, yy = y(v); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text class="axis" x="${L - 6}" y="${yy + 3}" text-anchor="end">${compact(v)}</text>`; }
  const pts = k => months.map((m, i) => `${x(i).toFixed(1)},${y(m[k]).toFixed(1)}`).join(' ');
  g += `<polygon points="${x(0)},${H - B} ${pts('inc')} ${x(n - 1)},${H - B}" fill="var(--inc)" opacity=".10"/>`;

function flowSvg(A) {
  const inc = A.inc, exp = A.exp, T = Math.max(inc, exp);
  if (!T) return '';
  const W = 360, H = 290, xl = 104, xr = 244, bw = 12, gap = 8, minH = 20;
  const cats = k => id => id === 'none' ? { n: 'Kateqoriyasız', co: '#78808C' } : (catOf(id) || { n: '?', co: '#78808C' });
  let L = Object.entries(A.byInc).sort((a, b) => b[1] - a[1]).map(([id, v]) => ({ n: cats()(id).n, co: cats()(id).co, v }));
  if (L.length > 5) { const rest = sum(L.slice(4), x => x.v); L = L.slice(0, 4).concat([{ n: 'Digər gəlirlər', co: '#78808C', v: rest }]); }
  if (exp > inc) L.push({ n: 'Əvvəlki qalıq', co: '#94A3B8', v: exp - inc });
  let R = Object.entries(A.byRoot).sort((a, b) => b[1] - a[1]).map(([id, v]) => ({ n: cats()(id).n, co: cats()(id).co, v }));
  if (R.length > 6) { const rest = sum(R.slice(5), x => x.v); R = R.slice(0, 5).concat([{ n: 'Digər xərclər', co: '#78808C', v: rest }]); }
  if (inc > exp) R.push({ n: 'Qalan (qənaət)', co: '#12805A', v: inc - exp });

    const avail = H - 10 - gap * (nodes.length - 1);
    let s = avail / T;
    for (let i = 0; i < 12; i++) { const tot = sum(nodes, n => Math.max(minH, n.v * s)); if (Math.abs(tot - avail) < 1) break; s *= avail / tot; }
    let y = 5; nodes.forEach(n => { n.h = Math.max(minH, n.v * s); n.y = y; y += n.h + gap; n.off = 0; });
  };
  lay(L); lay(R);
  const xm = (xl + bw + xr) / 2;
  let links = '', nodes = '';
  for (const a of L) for (const b of R) {
    const part = a.v * b.v / T; if (part <= 0) continue;
    const ha = a.h * b.v / T, hb = b.h * a.v / T;
    const y0 = a.y + a.off, y1 = y0 + ha, z0 = b.y + b.off, z1 = z0 + hb; a.off += ha; b.off += hb;
    links += `<path d="M${xl + bw} ${y0.toFixed(1)}C${xm} ${y0.toFixed(1)} ${xm} ${z0.toFixed(1)} ${xr} ${z0.toFixed(1)}L${xr} ${z1.toFixed(1)}C${xm} ${z1.toFixed(1)} ${xm} ${y1.toFixed(1)} ${xl + bw} ${y1.toFixed(1)}Z" fill="${b.co}" opacity=".26"><title>${esc(a.n)} → ${esc(b.n)}: ${fmtNum(part)}</title></path>`;
  }
  const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
  for (const a of L) nodes += `<rect x="${xl}" y="${a.y.toFixed(1)}" width="${bw}" height="${a.h.toFixed(1)}" rx="3" fill="${a.co}"/><text class="flowlbl" x="${xl - 7}" y="${(a.y + a.h / 2 - 1).toFixed(1)}" text-anchor="end">${esc(cut(a.n, 17))}</text><text class="flowsub" x="${xl - 7}" y="${(a.y + a.h / 2 + 10).toFixed(1)}" text-anchor="end">${compact(a.v)} ₼</text>`;
  for (const b of R) nodes += `<rect x="${xr}" y="${b.y.toFixed(1)}" width="${bw}" height="${b.h.toFixed(1)}" rx="3" fill="${b.co}"/><text class="flowlbl" x="${xr + bw + 7}" y="${(b.y + b.h / 2 - 1).toFixed(1)}">${esc(cut(b.n, 17))}</text><text class="flowsub" x="${xr + bw + 7}" y="${(b.y + b.h / 2 + 10).toFixed(1)}">${compact(b.v)} ₼</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pul axını diaqramı"><text class="axis" x="${xl}" y="-2" text-anchor="end" style="font-weight:800">GƏLİR MƏNBƏYİ</text><text class="axis" x="${xr + bw}" y="-2" style="font-weight:800">XƏRC YERİ</text>${links}${nodes}</svg>`;
}

}
function txList() {

  el.innerHTML = `<span>${esc(msg)}</span>${label ? `<button id="toastBtn">${esc(label)}</button>` : ''}`;
  el.classList.add('on');
  const b = $('#toastBtn'); if (b && fn) b.onclick = () => { el.classList.remove('on'); fn(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), label ? 6500 : 2800);
}
function paintSheet() {

  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(top.title)}"><header><h3>${esc(top.title)}</h3><button class="iconbtn" style="box-shadow:none;background:var(--surface-2)" data-act="closeSheet" aria-label="Bağla">${ic('x', 18)}</button></header><div class="body" id="sbody">${top.body()}</div>${top.footer ? `<footer>${top.footer()}</footer>` : ''}</div>`;
  bg.classList.add('on');
  if (top.mount) top.mount($('#sbody'));
}
function openSheet(def) { SH.stack.push(def); paintSheet(); }

function repaintSheet() { const b = $('#sbody'); if (!b) return; const top = SH.stack[SH.stack.length - 1]; if (!top) return; const sc = b.scrollTop; const f = $('.sheet footer'); if (f && top.footer) f.innerHTML = top.footer(); b.innerHTML = top.body(); b.scrollTop = sc; if (top.mount) top.mount(b); }
function confirmBox(title, text, okLabel, fn, danger = true) {

}
const fld = (label, inner, id) => `<div class="f"><label ${id ? `for="${id}"` : ''}>${label}</label>${inner}</div>`;
const optList = (arr, sel) => arr.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(l)}</option>`).join('');
const curOpts = sel => optList(CURS.map(c => [c, c + ' ' + SYM[c]]), sel);
const accOpts = (sel, excl) => optList(Object.values(D.accounts).filter(a => !a.ar || a.id === sel).sort((a, b) => a.o - b.o).filter(a => a.id !== excl).map(a => [a.id, `${a.n} (${a.cur})`]), sel);
function evalAmt(s) { // supports 12,5+3 style sums
  s = String(s == null ? '' : s).trim(); if (!s) return NaN;
  const parts = s.split('+'); let t = 0;
  for (const p of parts) { const v = toMinor(p); if (isNaN(v)) return NaN; t += v; }
  return t;
}
const amtStr = m => m ? String(m / 100).replace('.', ',') : '';

}

        if (R.rd !== '') it.rd = +R.rd; else delete it.rd;
        putItem('recs', it); closeSheet(); toast('Saxlanıldı'); if (it.auto && it.on) runRecurring();
      };

function postRec(r, date) {
  putTx({ id: `r-${r.id}-${date}`, k: r.k, a: r.a, ac: r.ac, d: date, tm: '', p: r.n, n: 'Təkrarlanan', ca: r.ca, rec: r.id, x: 0 });
}
function advanceRec(r, date) { return putItem('recs', { ...r, nd: nextByFreq(date, r.fr, r.day), last: date }); }
function payRec(id) {
  const r = D.recs[id]; if (!r) return; const d = r.nd;
  postRec(r, d); advanceRec(r, d); toast(`${r.n} qeyd olundu`);
}
function runRecurring() {
  if (D.cfg.autoRec === false || !S.server) return;
  const t = todayStr();
  for (const r of Object.values(D.recs)) {
    if (!r.auto || r.on === 0 || !r.nd) continue;
    let cur = r, n = 0;
    while (cur.nd && cur.nd <= t && n++ < 24) { const date = cur.nd; if (!D.txMap[`r-${cur.id}-${date}`]) postRec(cur, date); const nx = nextByFreq(date, cur.fr, cur.day); cur = { ...cur, nd: nx, last: date }; }
    if (cur !== r) putItem('recs', cur);
  }
}

/* ===== lock: password (PBKDF2) + optional Face ID / fingerprint (WebAuthn) ===== */
const LK = { fails: 0, until: 0, bioOk: false };
function devId() { try { let d = localStorage.getItem('fin-dev'); if (!d) { d = uid(); localStorage.setItem('fin-dev', d); } return d; } catch (e) { return LK.mem || (LK.mem = uid()); } }
function bioAvail() { return LK.bioOk; }
async function detectBio() {
  try { LK.bioOk = !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { LK.bioOk = false; }
}
async function pbkdf(pw, salt, it) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: it }, k, 256));
}
async function makeLock(pw) { const salt = crypto.getRandomValues(new Uint8Array(16)), it = 150000; return { salt: b64(salt), it, hash: await pbkdf(pw, salt, it) }; }
async function checkPw(pw) { const l = D.cfg.lock; if (!l) return true; return (await pbkdf(pw, unb64(l.salt), l.it)) === l.hash; }

function showLock(msg) {
  S.unlocked = false; S.locked = true;
  const el = $('#lock'); if (!el) return; closeAllSheets();
  const bioHere = !!(D.cfg.bio && D.cfg.bio[devId()]) && LK.bioOk;
  el.innerHTML = `<div class="lockcard"><div class="logo">${ic('wallet', 30)}</div><h2>Maliyyə Kitabı</h2><p>${esc(msg || 'Davam etmək üçün parolu yazın')}</p>
    <input id="lk-pw" class="in pwin" type="password" autocomplete="current-password" placeholder="Parol" aria-label="Parol"><div class="err" id="lk-err" role="alert"></div>
    <button class="btn" id="lk-ok">Aç</button>${bioHere ? `<button class="btn sec" id="lk-bio">${ic('faceid', 20)} Face ID / barmaq izi</button>` : ''}</div>`;
  el.classList.add('on');
  const go = async () => {
    const e = $('#lk-err'), now = Date.now();
    if (now < LK.until) { e.textContent = `${Math.ceil((LK.until - now) / 1000)} saniyə gözləyin`; return; }
    const pw = $('#lk-pw').value; if (!pw) return;
    $('#lk-ok').disabled = true;
    let ok = false; try { ok = await checkPw(pw); } catch (x) { }
    $('#lk-ok').disabled = false;
    if (ok) { LK.fails = 0; unlock(); } else { LK.fails++; if (LK.fails >= 3) LK.until = Date.now() + Math.min(60, 5 * (LK.fails - 2)) * 1000; e.textContent = 'Parol səhvdir'; $('#lk-pw').value = ''; $('#lk-pw').focus(); }
  };
  $('#lk-ok').onclick = go; $('#lk-pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  const b = $('#lk-bio'); if (b) b.onclick = bioUnlock;
  setTimeout(() => { const p = $('#lk-pw'); if (p) p.focus(); }, 80);
  if (bioHere && !msg) setTimeout(bioUnlock, 250);
}
function unlock() { S.unlocked = true; S.locked = false; S.lastActive = Date.now(); const el = $('#lock'); el.classList.remove('on'); el.innerHTML = ''; render(); afterUnlock(); }
async function bioUnlock() {
  const rec = D.cfg.bio && D.cfg.bio[devId()]; if (!rec) return;
  try {
    const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(rec.cid) }], userVerification: 'required', timeout: 60000 } });

}
async function enableBio() {

    if (!cred) throw 0;
    setCfg({ bio: { [devId()]: { cid: b64(cred.rawId), t: Date.now() } } }); toast('Face ID / barmaq izi bu cihazda aktivdir');
  } catch (e) { toast('Biometrik giriş qurula bilmədi. Bu mühit icazə verməyə bilər.'); }
}

/* auto-lock */

/* ===== main: boot, sync, events ===== */
let _rq;
function scheduleRender() { cancelAnimationFrame(_rq); _rq = requestAnimationFrame(() => { if (S.loaded && S.unlocked) render(); }); }
const DOWN = { api: null };

function splash(html) { const s = $('#splash'); if (!s) return; s.innerHTML = `<div>${html}</div>`; s.style.display = 'grid'; }

async function boot() {
  S.ym = ymOfDate(todayStr());
  splash('<div class="spin"></div><span>Yüklənir…</span>');
  detectBio();
  let db = null, user = null;
  try { if (window.claude && window.claude.use) { db = await window.claude.use('db'); user = await window.claude.use('user'); } } catch (e) { }
  try { DOWN.api = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { }
  if (!db || !user) { splash(`${ic('lock', 36)}<b style="color:var(--ink)">Giriş lazımdır</b><span>Məlumatların hesabınızda saxlanması üçün claude.ai hesabına daxil olun və səhifəni yenidən açın.</span>`); return; }
  try { S.uid = await user.id(); } catch (e) { }
  if (!S.uid) { splash('<b style="color:var(--ink)">İstifadəçi tapılmadı</b><span>Hesaba daxil olub səhifəni yeniləyin.</span>'); return; }
  S.db = db;
  const timer = setTimeout(() => { if (!S.loaded) splash(`<b style="color:var(--ink)">Bağlantı yoxdur</b><span>Məlumatlar yüklənmədi. İnternetinizi yoxlayın.</span><button class="btn" onclick="location.reload()">Yenidən cəhd et</button>`); }, 10000);
  db.collection(`data/users/${S.uid}`).onSnapshot(snap => {
    clearTimeout(timer);
    const fromCache = !!(snap.metadata && snap.metadata.fromCache);
    const docs = snap.docs || []; let n = 0;
    docs.forEach(d => { const id = d.id; if (S.pendingDocs && S.pendingDocs.has(id)) return; S.docs[id] = d.data() || {}; S.remote.add(id); n++; });
    if (!fromCache) S.server = true;
    rebuild();
    if (!S.loaded) {
      if (fromCache && !n) return; // wait for server answer before seeding / showing
      S.loaded = true; hideSplash(); start();
    } else if (S.server && !S.seeded) seedIfNeeded();
    scheduleRender();
  }, err => { clearTimeout(timer); console.warn(err); if (!S.loaded) splash(`<b style="color:var(--ink)">Yüklənmədi</b><span>${esc((err && err.message) || 'Xəta')}</span><button class="btn" onclick="location.reload()">Yenidən cəhd et</button>`); });
}
function seedIfNeeded() {

  if (!S.docs.categories || !Object.keys(itemsOf('categories')).length) { const d = buildDefaults(); save('categories', { items: d.cats }); if (!Object.keys(itemsOf('accounts')).length) save('accounts', { items: d.accounts }); }
  else if (!Object.keys(itemsOf('accounts')).length) save('accounts', { items: buildDefaults().accounts });

}
function start() {

  setInterval(() => { if (S.unlocked) { const rl = reminders().length; if (rl !== S.lastRem) { S.lastRem = rl; scheduleRender(); } } }, 60000);
}
function afterUnlock() {
  if (!S.server) { const w = setInterval(() => { if (S.server) { clearInterval(w); runRecurring(); } }, 800); setTimeout(() => clearInterval(w), 15000); } else runRecurring();
  notifyDue();
  if (!D.cfg.lock && !localStorage_get('fin-pwask')) { localStorage_set('fin-pwask', '1'); setTimeout(() => { if (S.unlocked && !S.sheetOpen) openSheet({ title: 'Xoş gəlmisiniz', body: () => `<div class="note">${ic('shield', 18)}<span>Maliyyə məlumatlarınızı qorumaq üçün giriş parolu qurmağı məsləhət görürəm. Face ID / barmaq izi də sonra əlavə edilə bilər.</span></div>`, footer: () => `<button class="btn sec" data-act="closeSheet">Sonra</button><button class="btn" id="wl-ok">Parol qur</button>`, mount: () => { $('#wl-ok').onclick = () => { closeSheet(); openSetPw(false); }; } }); }, 900); }
}

function localStorage_set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }

/* ---------- extra charts ---------- */
function sparkArea(vals, color, h = 54) {

  const x = i => (i / (n - 1) * W).toFixed(1), y = v => (4 + (h - 8) * (1 - (v - mn) / rg)).toFixed(1);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px" aria-hidden="true"><defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${pts} ${W},${h}" fill="url(#spg)"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="${x(n - 1)}" cy="${y(vals[n - 1])}" r="3.5" fill="${color}"/></svg>`;
}
function ringSvg(ratio, color, size = 64, label) {

  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" style="flex:none"><circle cx="32" cy="32" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="36.5" text-anchor="middle" style="font-size:14px;font-weight:800;fill:currentColor">${esc(label)}</text></svg>`;
}
function monthBarsSvg(ms) {
  const W = 640, H = 180, L = 38, B = 24, T = 10, n = ms.length;
  const max = niceMax(Math.max(1, ...ms.map(m => Math.max(m.inc, m.exp))));
  const gw = (W - L) / n, bw = Math.min(26, gw * 0.3), y = v => T + (H - B - T) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 2; i++) { const v = max * i / 2, yy = y(v); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text class="axis" x="${L - 6}" y="${yy + 3}" text-anchor="end">${compact(v)}</text>`; }
  ms.forEach((m, i) => {
    const cx = L + gw * i + gw / 2, hi = (H - B - T) * m.inc / max, he = (H - B - T) * m.exp / max;
    g += `<rect x="${cx - bw - 2}" y="${H - B - hi}" width="${bw}" height="${Math.max(m.inc ? 2 : 0, hi)}" rx="5" fill="var(--inc)" opacity="${m.cur ? 1 : .55}"><title>${m.label}: gəlir ${fmtNum(m.inc)}</title></rect>`;
    g += `<rect x="${cx + 2}" y="${H - B - he}" width="${bw}" height="${Math.max(m.exp ? 2 : 0, he)}" rx="5" fill="var(--exp)" opacity="${m.cur ? 1 : .55}"><title>${m.label}: xərc ${fmtNum(m.exp)}</title></rect>`;
    g += `<text class="axis" x="${cx}" y="${H - 6}" text-anchor="middle" style="${m.cur ? 'font-weight:800;fill:var(--ink)' : ''}">${m.label}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylar üzrə gəlir və xərc">${g}</svg>`;

function heatCal(p, byDay) {

function weekdaySvg(list) {

/* ---------- helpers ---------- */
function totalBalance() { const bal = balances(); return sum(Object.values(D.accounts).filter(a => !a.ar), a => toBase(bal[a.id] || 0, a.cur)); }
function balanceTrend(days) {
  const t = todayStr(), now = totalBalance(), net = {};
  for (const x of D.tx) if (x.k !== 't' && x.d > addDays(t, -days)) net[x.d] = (net[x.d] || 0) + (x.k === 'i' ? 1 : -1) * txAmtBase(x);
  const out = []; let b = now;
  for (let i = 0; i < days; i++) { const d = addDays(t, -i); out.unshift(b); b -= (net[d] || 0); }
  return out;
}
function catUsage(k) { const c = {}, lim = addDays(todayStr(), -120); for (const t of D.tx) if (t.k === k && t.d >= lim) { const r = catRoot(t.ca); if (r) c[r.id] = (c[r.id] || 0) + 1; } return c; }
function sortByUse(roots, k) { const u = catUsage(k); return [...roots].sort((a, b) => (u[b.id] || 0) - (u[a.id] || 0) || a.o - b.o); }
function templates(n = 6) {
  const m = {}, lim = addDays(todayStr(), -120);
  for (const t of D.tx) { if (t.k === 't' || t.d < lim || !t.ca) continue; const key = t.k + '|' + t.ca + '|' + (t.p || '').toLowerCase(); if (!m[key]) m[key] = { t, c: 0 }; m[key].c++; }
  return Object.values(m).sort((a, b) => b.c - a.c || b.t.d.localeCompare(a.t.d)).slice(0, n).map(x => x.t);
}
function insights(A, B, p) {
  const out = [], t = todayStr();
  const ch = Object.keys({ ...A.byRoot, ...B.byRoot }).map(id => ({ id, d: (A.byRoot[id] || 0) - (B.byRoot[id] || 0), a: A.byRoot[id] || 0, b: B.byRoot[id] || 0 })).filter(x => x.b > 0 && x.a > 0).sort((a, b) => Math.abs(b.d) - Math.abs(a.d))[0];
  if (ch && Math.abs(ch.d) > 500) { const c = catOf(ch.id); if (c) out.push({ ic: ch.d > 0 ? 'trend' : 'check', co: ch.d > 0 ? 'var(--exp)' : 'var(--inc)', tx: `<b>${esc(c.n)}</b> xərci keçən aya görə ${ch.d > 0 ? 'artıb' : 'azalıb'}: ${money(Math.abs(ch.d), 'AZN', false)} (${Math.round(Math.abs(ch.d) / ch.b * 100)}%)` }); }
  const big = A.list.filter(x => x.k === 'e').sort((a, b) => txAmtBase(b) - txAmtBase(a))[0];
  if (big) out.push({ ic: 'receipt', co: 'var(--warn)', tx: `Ən böyük xərc: <b>${esc(big.p || catName(big.ca))}</b>, ${money(txAmtBase(big), 'AZN', false)} (${dShort(big.d)})` });
  const end = t < p.to ? t : p.to; let free = 0; for (let d = p.from; d <= end; d = addDays(d, 1)) if (!A.byDay[d]) free++;
  if (free && A.exp) out.push({ ic: 'star', co: 'var(--inc)', tx: `Bu dövrdə <b>${free} gün</b> heç xərc etməmisiniz` });
  if (A.inc) { const r = Math.round((A.inc - A.exp) / A.inc * 100); out.push({ ic: 'piggy', co: r >= 20 ? 'var(--inc)' : r >= 0 ? 'var(--warn)' : 'var(--exp)', tx: r >= 20 ? `Gəlirin <b>${r}%</b>-ni saxlamısınız. Əla nəticədir.` : r >= 0 ? `Qənaət dərəcəsi <b>${r}%</b>. 20%-ə çatdırmağa çalışın.` : `Bu ay xərc gəlirdən <b>${money(A.exp - A.inc, 'AZN', false)}</b> çoxdur.` }); }
  const pr = A.byPrio, pt = pr.must + pr.should + pr.lux; if (pt && pr.lux / pt > 0.25) out.push({ ic: 'alert', co: 'var(--warn)', tx: `Lüks xərclər ümumi xərcin <b>${Math.round(pr.lux / pt * 100)}%</b>-ni təşkil edir` });

/* legend rows with share bars */
function legendRows(entries, total, prefix) {
  return entries.map(([id, v]) => { const c = id === 'none' ? { n: 'Kateqoriyasız', co: '#78808C', ic: 'dots' } : catOf(id) || { n: '?', co: '#78808C', ic: 'dots' }; return `<button class="lg-row lg2" ${prefix ? `data-act="${prefix}" data-cat="${id}"` : ''}><span class="cico sm" style="--c:${c.co}">${ic(c.ic, 15)}</span><span class="nm">${esc(c.n)}<span class="pc">${pct(v, total)}%</span><span class="lbar"><i style="width:${Math.max(2, v / (total || 1) * 100).toFixed(1)}%;background:${c.co}"></i></span></span><b class="num">${money(v, 'AZN', false)}</b></button>`; }).join('');
}

/* ---------- reports: add calendar tab + insights ---------- */
const _vRep = vRep;
vRep = function () {
  if (S.rep !== 'cal') {
    let h = _vRep();
    h = h.replace(`data-k="year">İllik</button>`, `data-k="year">İllik</button><button class="" data-act="repTab" data-k="cal">Təqvim</button>`);
    if (S.rep === 'exp' && !S.repCat) { const p = periodOf(S.ym), A = agg(p), B = agg(periodOf(ymAdd(S.ym, -1))); const ic2 = insightCard(A, B, p); if (ic2) h = h.replace('<div class="grid g2">', `<div class="grid g2">${ic2.replace('class="card ', 'class="card span2 ')}`); }
    return h;
  }
  const tabs = [['exp', 'Xərc'], ['inc', 'Gəlir'], ['flow', 'Axın'], ['cmp', 'Müqayisə'], ['year', 'İllik'], ['cal', 'Təqvim']];
  const seg = `<div class="seg">${tabs.map(([k, l]) => `<button class="${S.rep === k ? 'on' : ''}" data-act="repTab" data-k="${k}">${l}</button>`).join('')}</div>`;
  const p = periodOf(S.ym), A = agg(p);
  return `<div class="grid">${seg}<div class="grid g2">${card('Xərc təqvimi', heatCal(p, A.byDay) + `<div class="tiny muted" style="margin-top:8px">Günə toxunun: həmin günün əməliyyatları açılacaq.</div>`)}${card('Həftənin günləri üzrə xərc', A.exp ? weekdaySvg(A.list) + `<div class="tiny muted" style="margin-top:8px">Qırmızı sütun ən çox xərc etdiyiniz gündür.</div>` : empty('calendar', 'Məlumat yoxdur', ''))}</div></div>`;
};

/* ---------- menu ---------- */

const _vMore = vMore;
vMore = function () {
  if (S.more === 'install') return vInstall();
  if (S.more) return _vMore();
  const L = Object.values(D.loans).filter(l => !l.cl), Dw = Object.values(D.debts).filter(d => !d.cl && d.dir === 'owe'), Dd = Object.values(D.debts).filter(d => !d.cl && d.dir === 'owed');
  const R = Object.values(D.recs).filter(r => r.on !== 0), G = Object.values(D.goals), Bu = Object.keys(D.budgets).filter(k => D.budgets[k] && D.budgets[k].l > 0 && !D.budgets[k].x);
  const accs = Object.values(D.accounts).filter(a => !a.ar), cats = Object.values(D.cats).length;

    <button class="mhead" data-act="goAccounts"><span class="mlogo">${ic('wallet', 26)}</span><span class="mid"><small>Ümumi qalıq</small><b class="num">${money(totalBalance())}</b><small>${accs.length} hesab</small></span>${ic('right', 18)}</button>
    <div class="mtiles">
      <button class="mt" data-act="goPlans" data-p="loans" style="--c:#8A3B3B">${ic('bank', 22)}<b class="num">${money(sum(L, l => l.rem), 'AZN', false)}</b><small>Kreditlər · ${L.length}</small></button>
      <button class="mt" data-act="goPlans" data-p="debts" style="--c:#D2432A">${ic('users', 22)}<b class="num">${money(sum(Dw, d => d.a - (d.paid || 0)), 'AZN', false)}</b><small>Borclarım · ${Dw.length}</small></button>
      <button class="mt" data-act="goPlans" data-p="debts" style="--c:#12805A">${ic('coins', 22)}<b class="num">${money(sum(Dd, d => d.a - (d.paid || 0)), 'AZN', false)}</b><small>Mənə borclu · ${Dd.length}</small></button>
      <button class="mt" data-act="goPlans" data-p="goals" style="--c:#0E9AA7">${ic('target', 22)}<b class="num">${money(sum(G, g => g.s), 'AZN', false)}</b><small>Məqsədlər · ${G.length}</small></button>
    </div>
    <div class="mgroup"><div class="mg-t">Planlaşdırma</div>
      ${mRow('goPlans', 'bank', '#8A3B3B', 'Kreditlər', 'Ödəniş tarixləri və qalıq', L.length ? L.length + ' aktiv' : '', 'data-p="loans"')}
      ${mRow('goPlans', 'users', '#B7791F', 'Borclar', 'Kimə borcluyam, kim mənə borcludur', (Dw.length + Dd.length) || '', 'data-p="debts"')}
      ${mRow('goPlans', 'repeat', '#2F5DA8', 'Təkrarlanan ödənişlər', 'Kommunal, icarə, abunə, maaş', R.length || '', 'data-p="recs"')}
      ${mRow('goPlans', 'sliders', '#C98A00', 'Büdcə limitləri', 'Kateqoriya üzrə aylıq limit', Bu.length || '', 'data-p="budget"')}
      ${mRow('goPlans', 'target', '#0E9AA7', 'Qənaət məqsədləri', 'Tətil, ehtiyat fondu və s.', G.length || '', 'data-p="goals"')}</div>
    <div class="mgroup"><div class="mg-t">Məlumat</div>
      ${mRow('goAccounts', 'card', '#0B6B5D', 'Hesablar və kartlar', 'Nağd, kart, depozit', accs.length)}
      ${mRow('goCats', 'tag', '#7A4FD1', 'Kateqoriyalar', 'Yeni kateqoriya yaradın', cats)}
      ${mRow('tab', 'pie', '#E0457B', 'Hesabatlar', 'Aylıq, illik, təqvim, axın', '', 'data-v="rep"')}
      ${mRow('goBackup', 'download', '#0E9AA7', 'Ehtiyat və ixrac', 'JSON, CSV, bərpa')}
      ${mRow('goTrash', 'trash', '#D2432A', 'Silinənlər', 'Silinmiş qeydləri bərpa edin')}</div>
    <div class="mgroup"><div class="mg-t">Tətbiq</div>
      ${mRow('goInstall', 'phoneadd', '#111827', 'iPhone-a quraşdır', 'Ana ekrana tətbiq kimi əlavə edin')}
      ${mRow('goSettings', 'lock', '#2F5DA8', 'Təhlükəsizlik və ayarlar', D.cfg.lock ? 'Parol aktivdir' : 'Parol qurulmayıb', '')}
      ${mRow('goAbout', 'info', '#4A5568', 'Haqqında', 'Məlumat harada saxlanılır')}</div></div>`;
};
function vInstall() {
  const st = (n, t, d, icon) => `<div class="istep"><span class="inum">${n}</span><div><b>${t}</b><small>${d}</small></div>${icon ? `<span class="iic">${ic(icon, 20)}</span>` : ''}</div>`;
  return `<div class="grid"><section class="card"><h2>Safari ilə ana ekrana</h2>
    ${st(1, 'Linki Safari-də açın', 'Bu səhifənin claude.ai linkini iPhone-da Safari-də açın və claude.ai hesabınıza daxil olun.', 'link')}
    ${st(2, '“Paylaş” düyməsinə toxunun', 'Ekranın aşağısındakı kvadrat və ox işarəli düymə.', 'share')}
    ${st(3, '“Ana ekrana əlavə et” seçin', 'Siyahını aşağı sürüşdürün, “Add to Home Screen” / “Ana ekrana əlavə et”.', 'phoneadd')}
    ${st(4, 'Ad verin: “Maliyyə”', 'İndi tətbiq ikonu iPhone ekranındadır, toxunanda birbaşa açılır.', 'check')}</section>
    <section class="card"><h2>Claude tətbiqi ilə</h2><p class="muted" style="margin:0">iPhone-da Claude tətbiqində bu söhbəti və ya Artifact-lar bölməsini açın: tətbiq orada da tam ekran işləyir, məlumatlar eynidir.</p></section>
    <div class="note">${ic('info', 18)}<span>Məlumat telefonda yox, claude.ai hesabınızda saxlanır. Telefonu dəyişsəniz və ya kompüterdən açsanız, hər şey yerindədir.</span></div></div>`;
}

/* ---------- add menu (FAB) ---------- */
function openAddMenu() {
  const tp = templates(6);
  openSheet({
    title: 'Nə əlavə edirsiniz?', body: () => `<div class="addbig">
      <button data-act="quick" data-k="e" style="--c:var(--exp)"><span>${ic('arrowOut', 26)}</span><b>Xərc</b></button>
      <button data-act="quick" data-k="i" style="--c:var(--inc)"><span>${ic('arrowIn', 26)}</span><b>Gəlir</b></button>
      <button data-act="quick" data-k="t" style="--c:#2F5DA8"><span>${ic('swap', 26)}</span><b>Köçürmə</b></button></div>
      <div class="addsm">
      <button data-act="sheetGo" data-to="loanPay">${cico({ ic: 'bank', co: '#8A3B3B' }, 18, 'sm')}Kredit ödənişi</button>
      <button data-act="sheetGo" data-to="debt">${cico({ ic: 'users', co: '#B7791F' }, 18, 'sm')}Yeni borc</button>
      <button data-act="sheetGo" data-to="rec">${cico({ ic: 'repeat', co: '#2F5DA8' }, 18, 'sm')}Təkrarlanan</button>
      <button data-act="sheetGo" data-to="goal">${cico({ ic: 'target', co: '#0E9AA7' }, 18, 'sm')}Məqsədə pul</button></div>
      ${tp.length ? `<div class="sec-title" style="margin:6px 2px 0">Tez təkrarla</div><div class="tpl">${tp.map((t, i) => { const c = catOf(t.ca); return `<button data-act="tpl" data-i="${i}">${cico(c, 17, 'sm')}<span class="mid"><b>${esc(t.p || (c ? c.n : ''))}</b><small>${esc(c ? c.n : '')}</small></span><b class="num ${t.k === 'i' ? 'inc' : 'exp'}">${fmtNum(t.a, t.a % 100 !== 0)}</b></button>`; }).join('')}</div>` : ''}`
  });
  SH.tpl = tp;
}
Object.assign(ACT, {
  addMenu: () => openAddMenu(),
  quick: el => { closeAllSheets(); openTx(null, { k: el.dataset.k }); },
  tpl: el => { const t = SH.tpl[+el.dataset.i]; closeAllSheets(); openTx(null, { k: t.k, ca: t.ca, p: t.p, ac: t.ac, a: amtStr(t.a) }); },
  sheetGo: el => {
    closeAllSheets(); const to = el.dataset.to;
    if (to === 'loanPay') { const ls = Object.values(D.loans).filter(l => !l.cl); if (ls.length === 1) openPayLoan(ls[0].id); else { S.view = 'plans'; S.plans = 'loans'; render(); if (!ls.length) openLoan(); } }
    else if (to === 'debt') openDebt(null); else if (to === 'rec') openRec();
    else { const gs = Object.values(D.goals); if (gs.length === 1) openDepGoal(gs[0].id); else { S.view = 'plans'; S.plans = 'goals'; render(); if (!gs.length) openGoal(); } }
  },
  goInstall: () => { S.view = 'more'; S.more = 'install'; S.toTop = true; render(); },
  goPlans: el => { S.view = 'plans'; S.plans = el.dataset.p; S.more = null; S.toTop = true; render(); },
  dayTx: el => { const d = el.dataset.d, list = D.tx.filter(t => t.d === d); openSheet({ title: dayLabel(d), body: () => list.length ? `<div class="rows">${list.map(t => txRow(t)).join('')}</div>` : empty('receipt', 'Bu gün əməliyyat yoxdur', '', `<div><button class="btn sm" style="margin-top:10px" data-act="quickDate" data-d="${d}">Xərc əlavə et</button></div>`) }); },
  quickDate: el => { closeAllSheets(); openTx(null, { d: el.dataset.d }); }
});
const _editTx = ACT.editTx; ACT.editTx = el => { closeAllSheets(); _editTx(el); };
/* collapse large title into small title on scroll */
addEventListener('scroll', () => { const tb = document.getElementById('topbar'); if (tb) tb.classList.toggle('scrolled', scrollY > 40); }, { passive: true });

/* ===== standalone build texts & backup reminder ===== */
function lastBackupDays() { const v = +(localStorage_get('mk-lastbackup') || 0); return v ? Math.floor((Date.now() - v) / 864e5) : null; }
const _exportJson = exportJson;
exportJson = function () { _exportJson(); localStorage_set('mk-lastbackup', String(Date.now())); setTimeout(scheduleRender, 500); };
ACT.exportJson = () => exportJson();
function vAbout() {
  return `<div class="grid"><section class="card"><h2>Məlumat harada saxlanılır</h2>
    <div class="kv"><span>Saxlama</span><b>Bu telefonun yaddaşı</b></div><div class="kv"><span>İnternet</span><b>Lazım deyil</b></div><div class="kv"><span>Saxlanma anı</span><b>“Saxla” basılan kimi</b></div><div class="kv"><span>Ehtiyat nüsxə</span><b>${lastBackupDays() == null ? 'Hələ yoxdur' : lastBackupDays() + ' gün əvvəl'}</b></div>
    <div class="note" style="margin-top:12px">${ic('alert', 18)}<span>Tətbiqi ana ekrandan silsəniz və ya Safari-də “Sayt məlumatlarını təmizlə” etsəniz, məlumat da silinir. Ona görə həftədə bir dəfə <b>Menyu → Ehtiyat və ixrac → JSON endir</b> edin və faylı iCloud Drive-da saxlayın. Yeni telefonda həmin faylla bərpa edə bilərsiniz.</span></div></section></div>`;
}
function vInstall() {
  const st = (n, t, d, icon) => `<div class="istep"><span class="inum">${n}</span><div><b>${t}</b><small>${d}</small></div>${icon ? `<span class="iic">${ic(icon, 20)}</span>` : ''}</div>`;
  return `<div class="grid"><section class="card"><h2>Ana ekrana əlavə etmək</h2>
    ${st(1, 'Səhifəni Safari-də açın', 'Tətbiqin linkini iPhone-da məhz Safari ilə açın.', 'link')}
    ${st(2, '“Paylaş” düyməsi', 'Aşağıdakı kvadrat və yuxarı ox işarəsi.', 'share')}
    ${st(3, '“Ana ekrana əlavə et”', 'Siyahını aşağı sürüşdürüb seçin, ad: Maliyyə.', 'phoneadd')}
    ${st(4, 'Həmişə ikondan açın', 'Məlumat ikondan açılan tətbiqdə saxlanır. Safari tabında ayrıca yaddaş olur.', 'check')}</section>

}
const _vHome = vHome;
vHome = function () {
  let h = _vHome(); const d = lastBackupDays();
  if (D.tx.length >= 5 && (d == null || d >= 14)) h = h.replace('<div class="qas">', `<div class="alert" style="margin-bottom:0">${cico({ ic: 'download', co: '#0E9AA7' })}<div class="mid"><b>Ehtiyat nüsxə vaxtıdır</b><small>${d == null ? 'Hələ heç ehtiyat götürülməyib' : d + ' gündür ehtiyat götürülməyib'}</small></div><button class="btn sm" data-act="exportJson">Endir</button></div><div class="qas">`);
  return h;
};
/* hide cloud-only wording */
const _vMore2 = vMore;
vMore = function () { return _vMore2().replace('Məlumat harada saxlanılır', 'Telefonda saxlanma, ehtiyat'); };
const _vSettings = vSettings;
vSettings = function () { return _vSettings().replace('Hesabınıza claude.ai girişi ilə daxil olursunuz. Bu parol əlavə qoruma qatıdır: tətbiq', 'Telefonunuzu başqası götürsə belə, maliyyə məlumatınız görünməsin: tətbiq'); };
